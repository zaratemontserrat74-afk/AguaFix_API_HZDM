services:
  postgres:
    image: postgres:16
    container_name: aguafix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
 
  api:
    image: ${DOCKER_USER}/aguafix-api:latest
    container_name: aguafix-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Dentro de Docker la BD se llama por el nombre del servicio, no localhost
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
 
volumes:
  postgres_data:
 